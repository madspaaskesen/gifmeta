[package]
name = "gifmeta"
version = "0.6.2"
edition = "2021"
authors = ["Mads Paaskesen <madspaaskesen@gmail.com>"]
description = "Inspect and edit animated GIFs: fix loops and delays, render frames, and delete frames safely, even in frame-optimized GIFs."
license = "MIT"
repository = "https://github.com/madspaaskesen/gifmeta"
homepage = "https://gifmeta.com"
documentation = "https://docs.rs/gifmeta"
readme = "README.md"
categories = ["multimedia::images", "command-line-utilities", "multimedia::encoding"]
keywords = ["gif", "animation", "frames", "loop", "cli"]
exclude = [".DS_Store"]

[dependencies]
gif = "0.12.0"
color_quant = "1.1.0"
clap = { version = "4.4.0", features = ["derive"] }
tempfile = "3.20.0"
uuid = { version = "1.17.0", features = ["v4"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
image = { version = "0.25.6", features = ["png"] }
base64 = "0.22.1"

# Optimize dependencies (gif / image decoding) in dev + test builds — keeps `cargo test`
# fast while our own crate still compiles quickly in debug mode.
[profile.dev.package."*"]
opt-level = 3
